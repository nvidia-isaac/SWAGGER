[tool.poetry]
name = "swagger"
version = "0.1.0"
description = "SWAGGER: Sparse WAypoint Graph Generation for Efficient Routing"
authors = []
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
colorlog = ">=6.9.0,<7.0.0"
cucim-cu12 = ">=26.6.0,<26.7.0"
fastapi = ">=0.136.1"
fastapi-versioning = ">=0.10.0"
h11 = ">=0.16.0"
httpx = ">=0.28.1,<0.29.0"
networkx = ">=3.4.2,<4.0.0"
numba = ">=0.66.0,<0.67.0"
numpy = ">=2.4.6,<2.5"
numpydantic = ">=1.6.8,<2.0.0"
pillow = ">=10.1.0,<12.0.0"
psutil = ">=7.0.0,<8.0.0"
pydantic = ">=2.11.4"
python-multipart = ">=0.0.22"
requests = ">=2.32.4,<3.0.0"
rtree = ">=1.4.0,<2.0.0"
scikit-image = ">=0.25.2,<0.26.0"
scipy = ">=1.11.4,<2.0.0"
skan = ">=0.13.1,<0.14.0"
tyro = ">=1.0.15,<1.1.0"
uvicorn = ">=0.52.1,<0.53.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
